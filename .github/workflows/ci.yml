name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # TEMPORARY: DRE from the reviewed commit that supports data tests, as no release has the
      # support yet, and its build needs a recent stable Rust.
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: get-dre/dre
          ref: 739d9c57eeeff1e8c7058a12226e176ce962a291
          path: dre
          persist-credentials: false
      # Switch to a core release before this package is released: an older DRE could silently skip
      # the data tests the integration reports declare.
      - run: cargo build -p dre-cli
        working-directory: dre
      - name: Install plugins
        working-directory: integration_tests
        env:
          DRE: ${{ github.workspace }}/dre/target/debug/dre
        run: '"$DRE" deps'
      - run: integration_tests/run.sh
        env:
          DRE: ${{ github.workspace }}/dre/target/debug/dre
