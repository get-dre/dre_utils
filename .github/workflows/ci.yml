name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install released DRE
        run: |
          python3 -m venv "$RUNNER_TEMP/dre"
          "$RUNNER_TEMP/dre/bin/python" -m pip install dre-cli==0.11.0
          echo "$RUNNER_TEMP/dre/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/dre/bin/dre" --version | grep -Fx 'dre 0.11.0'
      - name: Install plugins
        working-directory: integration_tests
        run: dre deps
      - run: integration_tests/run.sh
